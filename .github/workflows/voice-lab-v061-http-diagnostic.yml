
name: Infinity Voice Lab v0.6.1 HTTP Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect Cloudflare HTTP responses
        run: |
          node --input-type=module <<'NODE'
          const base =
            "https://infinity-voice-api-lab-v061.estrategia-a81.workers.dev";

          const paths = ["/health", "/security"];

          function safeLocation(value) {
            if (!value) return "none";
            try {
              const url = new URL(value, base);
              return url.origin + url.pathname;
            } catch {
              return "unparseable";
            }
          }

          async function inspect(path) {
            console.log(`\nChecking ${path}`);

            const response = await fetch(base + path, {
              method: "GET",
              redirect: "manual",
              headers: {
                Accept: "application/json"
              },
              signal: AbortSignal.timeout(15000)
            });

            console.log("HTTP status:", response.status);
            console.log(
              "Content-Type:",
              response.headers.get("content-type") ?? "missing"
            );
            console.log(
              "Server:",
              response.headers.get("server") ?? "missing"
            );
            console.log(
              "CF-Ray present:",
              Boolean(response.headers.get("cf-ray"))
            );
            console.log(
              "Redirect:",
              safeLocation(response.headers.get("location"))
            );

            const body = await response.text();
            const trimmed = body.trimStart();

            let kind = "other";

            if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
              kind = "json-like";
            } else if (
              trimmed.startsWith("<!DOCTYPE") ||
              trimmed.startsWith("<html") ||
              trimmed.startsWith("<HTML")
            ) {
              kind = "html";
            } else if (trimmed.length === 0) {
              kind = "empty";
            }

            console.log("Response format:", kind);
            console.log("Response bytes:", Buffer.byteLength(body));

            if (kind === "json-like") {
              try {
                const data = JSON.parse(body);
                console.log(
                  "JSON error code:",
                  typeof data.error === "string"
                    ? data.error
                    : "none"
                );
                console.log(
                  "Worker version:",
                  typeof data.version === "string"
                    ? data.version
                    : "not reported"
                );
              } catch {
                console.log("JSON parsing: invalid");
              }
            }

            if (kind === "html") {
              const markers = [
                "cloudflareaccess.com",
                "cf-challenge",
                "challenge-platform",
                "Just a moment",
                "Access denied"
              ];

              for (const marker of markers) {
                console.log(
                  `HTML marker ${marker}:`,
                  body.includes(marker)
                );
              }
            }
          }

          for (const path of paths) {
            await inspect(path);
          }

          console.log("\nHTTP diagnostic completed");
          NODE
