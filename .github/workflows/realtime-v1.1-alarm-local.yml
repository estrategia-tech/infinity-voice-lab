name: Infinity Voice v1.1 Real Alarm Local Test
on:
  push:
    branches: [lab/realtime-v1-1-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Wrangler
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Verify alarm persists and fires after restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/infinity-voice-alarm-v11
          npx wrangler dev --local --config wrangler.realtime-v11-alarm-local.jsonc --port 8794 --persist-to /tmp/infinity-voice-alarm-v11 > /tmp/alarm-v11-first.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..35}; do if curl -fsS http://127.0.0.1:8794/health >/dev/null; then break; fi; sleep 1; done
          node realtime-v1.1-alarm-local-integration.mjs bind
          kill "$pid" || true
          wait "$pid" || true
          npx wrangler dev --local --config wrangler.realtime-v11-alarm-local.jsonc --port 8794 --persist-to /tmp/infinity-voice-alarm-v11 > /tmp/alarm-v11-restart.log 2>&1 &
          pid=$!
          for i in {1..35}; do if curl -fsS http://127.0.0.1:8794/health >/dev/null; then break; fi; sleep 1; done
          node realtime-v1.1-alarm-local-integration.mjs restart
      - name: Verify mock provider failure and bounded alarm retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/infinity-voice-alarm-retry
          npx wrangler dev --local --config wrangler.realtime-v11-alarm-retry-local.jsonc --port 8795 --persist-to /tmp/infinity-voice-alarm-retry > /tmp/alarm-retry.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..35}; do if curl -fsS http://127.0.0.1:8795/health >/dev/null; then break; fi; sleep 1; done
          TEST_BASE_URL=http://127.0.0.1:8795 node realtime-v1.1-alarm-local-integration.mjs bind
          TEST_BASE_URL=http://127.0.0.1:8795 node realtime-v1.1-alarm-local-integration.mjs restart
