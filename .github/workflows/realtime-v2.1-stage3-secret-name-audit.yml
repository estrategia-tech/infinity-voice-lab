name: Infinity Voice v2.1 Stage3 Secret Name Audit

on:
  push:
    branches: [lab/realtime-v1-1-candidate]
    paths:
      - '.github/workflows/realtime-v2.1-stage3-secret-name-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-secret-names:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout authorized laboratory branch
        uses: actions/checkout@v4
        with:
          ref: lab/realtime-v1-1-candidate
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: List deployed secret names only and verify required set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(npx wrangler secret list --config wrangler.realtime-v21-stage3.jsonc --format json)"
          export OUT
          node --input-type=module <<'NODE'
          const data = JSON.parse(process.env.OUT);
          const names = data.map((item) => item.name).sort();
          const required = [
            'INTERNAL_CALLER_ALLOWLIST',
            'LAB_ACCESS_TOKEN',
            'OPENAI_API_KEY',
            'OPENAI_WEBHOOK_SECRET',
          ];
          console.log(`Deployed secret names: ${names.join(', ') || '(none)'}`);
          const missing = required.filter((name) => !names.includes(name));
          if (missing.length) {
            console.error(`Missing required secret names: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log('PASS: all required Stage3 secret names exist in Cloudflare; values were not read or exposed');
          NODE
