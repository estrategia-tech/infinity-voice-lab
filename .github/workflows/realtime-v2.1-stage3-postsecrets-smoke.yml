name: Infinity Voice v2.1 Stage3 Post-Secrets Smoke

on:
  push:
    branches: [lab/realtime-v1-1-candidate]
    paths:
      - '.github/workflows/realtime-v2.1-stage3-postsecrets-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed health remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          URL='https://infinity-voice-v21-stage3-lab.estrategia-a81.workers.dev/health'
          BODY="$(curl --fail --silent --show-error "$URL")"
          export BODY
          node --input-type=module <<'NODE'
          const d = JSON.parse(process.env.BODY);
          if (d.service !== 'infinity-voice-stage3-lab') throw new Error('unexpected-service');
          if (d.version !== '2.1.0-stage3-candidate') throw new Error('unexpected-version');
          if (d.live_enabled !== false) throw new Error('live-must-remain-disabled');
          if (d.static_emergency_stop !== true) throw new Error('static-emergency-stop-must-remain-active');
          if (d.record_audio !== false) throw new Error('recording-must-remain-disabled');
          if (d.customer_traffic !== false) throw new Error('customer-traffic-must-remain-disabled');
          console.log('PASS: deployed Stage3 remains fail-closed after secret configuration');
          NODE

      - name: Verify required Stage3 configuration is present without exposing values
        shell: bash
        run: |
          set -euo pipefail
          URL='https://infinity-voice-v21-stage3-lab.estrategia-a81.workers.dev/readiness'
          BODY="$(curl --fail --silent --show-error "$URL")"
          export BODY
          node --input-type=module <<'NODE'
          const d = JSON.parse(process.env.BODY);
          if (d.service !== 'infinity-voice-stage3-lab') throw new Error('unexpected-service');
          if (d.configuration_ready !== true) throw new Error('stage3-configuration-not-ready');
          if (!Number.isInteger(d.internal_allowlist_entries) || d.internal_allowlist_entries < 1) throw new Error('internal-allowlist-missing');
          if (d.live_enabled !== false) throw new Error('live-must-remain-disabled');
          if (d.static_emergency_stop !== true) throw new Error('static-emergency-stop-must-remain-active');
          if (d.dynamic_emergency_stop !== 'active') throw new Error('dynamic-emergency-stop-must-remain-active');
          if (d.provider_call_performed !== false) throw new Error('provider-call-unexpected');
          if (d.secret_values_exposed !== false) throw new Error('secret-values-exposed');
          console.log(`PASS: required Stage3 secrets/config are present; allowlist entries=${d.internal_allowlist_entries}; values remain undisclosed`);
          NODE

      - name: Reject unsigned webhook without provider action
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/webhook.txt --write-out '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"type":"live.transport.incoming","data":{"type":"sip","session_id":"live_invalid_test"}}' \
            'https://infinity-voice-v21-stage3-lab.estrategia-a81.workers.dev/webhooks/openai')"
          test "$CODE" = '401' || { echo "Expected 401, got $CODE"; cat /tmp/webhook.txt; exit 1; }
          echo 'PASS: unsigned webhook is rejected'

      - name: Reject unauthenticated kill-switch mutation
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/admin.txt --write-out '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"active":false}' \
            'https://infinity-voice-v21-stage3-lab.estrategia-a81.workers.dev/admin/emergency-stop')"
          test "$CODE" = '401' || { echo "Expected 401, got $CODE"; cat /tmp/admin.txt; exit 1; }
          echo 'PASS: unauthenticated emergency-stop mutation is rejected'

      - name: Confirm no call-originating path was exercised
        run: |
          echo 'PASS: this workflow performs only GET readiness/health and negative HTTP admission tests.'
          echo 'No SIP handshake, provider accept, outbound call, prospect, or customer traffic was initiated.'
