name: Infinity Voice v1.5 Offline Acceptance
on:
  push:
    branches:
      - lab/realtime-v1-1-candidate
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline end-to-end acceptance and adversarial scenarios
        run: |
          node --check realtime-v1.5-acceptance.test.mjs
          node --test realtime-v1.5-acceptance.test.mjs
