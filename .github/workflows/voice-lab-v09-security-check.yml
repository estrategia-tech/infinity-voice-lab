
name: Infinity Voice Lab v0.9 Security Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check infinity-voice-v09-candidate.mjs
          node --check test-voice-v09-security.mjs

      - name: Security checks (no OpenAI calls)
        run: node --test test-voice-v09-security.mjs
