
name: Infinity Voice Lab v0.6.1 Tests

on:
  push:
    branches:
      - lab/voice-v0.6-security
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check worker-v0.6.1-candidate.mjs

      - name: Run v0.6.1 automated tests
        run: node --test test-v0.6.1.mjs
