
name: Infinity Voice Lab Tests

on:
  push:
    branches:
      - lab/voice-v0.6-security
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check worker-v0.6-candidate.js

      - name: Run automated tests
        run: node --test test.mjs
