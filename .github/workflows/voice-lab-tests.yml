
name: Infinity Voice Lab v0.6.1 Tests

on:
  push:
    branches:
      - lab/voice-v0.6-security
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check worker-v0.6.1-candidate.mjs

      - name: Run automated tests
        run: node --test test-v0.6.1.mjs

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Validate Cloudflare bundle
        run: |
          npx wrangler deploy \
            --config wrangler.lab.jsonc \
            --dry-run \
            --outdir .wrangler-dryrun
