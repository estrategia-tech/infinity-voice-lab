
name: Infinity Voice Lab - Cloudflare Manual

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Select operation"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - deploy

permissions:
  contents: read

jobs:
  worker:
    if: github.ref == 'refs/heads/lab/voice-v0.6-security'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate candidate
        run: |
          node --check worker-v0.6.1-candidate.mjs
          node --test test-v0.6.1.mjs

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --config wrangler.lab.jsonc --dry-run

      - name: Deploy to isolated Worker
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.lab.jsonc
