name: Infinity Voice v1.1 Candidate Safety Tests
on:
  push:
    branches:
      - lab/realtime-v1-1-candidate
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check all Realtime v1.1 laboratory modules
        run: |
          set -e
          for file in realtime-v1.1-*.mjs; do node --check "$file"; done
      - name: Verify public broker rejects internal and local routes
        run: node --test realtime-v1.1-public-boundary.test.mjs
      - name: Test disabled Realtime broker
        run: node --test realtime-v1.1-broker.test.mjs
      - name: Test session ledger candidate
        run: node --test realtime-v1.1-ledger.test.mjs
      - name: Test admission coordinator
        run: node --test realtime-v1.1-admission.test.mjs
      - name: Test isolated lab access guard
        run: node --test realtime-v1.1-access.test.mjs
      - name: Verify authoritative primary-ledger reconciliation
        run: node --test realtime-v1.1-primary-reconciliation.test.mjs
      - name: Verify fail-closed cross-ledger reconciliation
        run: node --test realtime-v1.1-reconciliation.test.mjs
      - name: Verify persistent alarm candidate
        run: node --test realtime-v1.1-alarm-ledger.test.mjs
      - name: Verify server-side timeout decision and binding
        run: node --test realtime-v1.1-timeout-coordinator.test.mjs
      - name: Verify atomic termination claim and fail-closed recovery
        run: node --test realtime-v1.1-claimed-termination.test.mjs
      - name: Verify reservation ownership before provider hangup
        run: node --test realtime-v1.1-safe-termination.test.mjs
      - name: Verify provider termination before reservation release
        run: node --test realtime-v1.1-termination-coordinator.test.mjs
      - name: Verify provider hangup adapter is fail-closed
        run: node --test realtime-v1.1-hangup.test.mjs
      - name: Verify end-to-end offline unified WebRTC rehearsal
        run: node --test realtime-v1.1-unified-rehearsal.test.mjs
      - name: Verify offline unified WebRTC SDP preparation
        run: node --test realtime-v1.1-unified-offer.test.mjs
      - name: Verify session termination and budget release gates
        run: node --test realtime-v1.1-lifecycle.test.mjs
      - name: Verify browser release gate
        run: node --test realtime-v1.1-browser-gate.test.mjs
      - name: Syntax-check browser candidate
        run: node --check realtime-v1.1-candidate.js
      - name: Syntax-check broker
        run: node --check realtime-v1.1-broker-candidate.mjs
